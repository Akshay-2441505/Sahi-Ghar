[project]
name = "sahighar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "openpyxl>=3.1.5",
    "truststore>=0.10.4",
    "pypdf>=6.19.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
