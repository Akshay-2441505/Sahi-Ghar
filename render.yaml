services:
  - type: web
    name: sahighar-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn sahighar.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # set to your Neon connection string in the Render dashboard
      - key: SAHIGHAR_PII_KEY
        sync: false # any long random string, kept secret -- required before any crawl/import runs
